<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가계부</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #202124;
      --muted: #6b7280;
      --line: #e5e7eb;
      --income: #2563eb;
      --expense: #dc2626;
      --balance: #059669;
      --primary: #111827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .month-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      border: 0;
      background: var(--primary);
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    button.secondary {
      background: #4b5563;
    }

    button.danger {
      background: #dc2626;
    }

    button.light {
      background: #e5e7eb;
      color: #111827;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    .summary-card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }

    .summary-card .label {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .summary-card .value {
      font-size: 26px;
      font-weight: 900;
    }

    .income { color: var(--income); }
    .expense { color: var(--expense); }
    .balance { color: var(--balance); }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .calendar {
      background: var(--card);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .weekday {
      padding: 10px;
      text-align: center;
      color: var(--muted);
      font-weight: 800;
      border-bottom: 1px solid var(--line);
    }

    .day {
      min-height: 120px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 10px;
      cursor: pointer;
      background: white;
    }

    .day:nth-child(7n) { border-right: 0; }

    .day.empty {
      background: #f9fafb;
      cursor: default;
    }

    .date-num {
      font-weight: 900;
      margin-bottom: 8px;
    }

    .day-line {
      font-size: 13px;
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .day-total {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
      font-weight: 900;
      font-size: 13px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.show { display: flex; }

    .modal {
      width: min(720px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    .modal h2 {
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px;
      font-size: 15px;
    }

    textarea { min-height: 84px; resize: vertical; }

    .full { grid-column: 1 / -1; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .entry-list {
      margin-top: 16px;
      border-top: 1px solid var(--line);
    }

    .entry-row {
      display: grid;
      grid-template-columns: 90px 90px 1fr 110px 74px;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .entry-row strong { font-size: 15px; }

    .category-row {
      display: grid;
      grid-template-columns: 1fr 80px;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }

    .chart-wrap {
      max-width: 520px;
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      .app { padding: 12px; }
      .summary { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .day { min-height: 96px; padding: 7px; }
      .day-line { font-size: 11px; display: block; }
      .entry-row {
        grid-template-columns: 1fr;
        gap: 4px;
        background: #f9fafb;
        border-radius: 12px;
        padding: 10px;
        margin: 8px 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1>가계부</h1>
      <div class="month-control">
        <button class="light" onclick="moveMonth(-1)">◀</button>
        <h2 id="monthTitle" style="margin:0;"></h2>
        <button class="light" onclick="moveMonth(1)">▶</button>
      </div>
    </div>

    <section class="summary">
      <div class="summary-card">
        <div class="label">총수입</div>
        <div id="totalIncome" class="value income">0원</div>
      </div>
      <div class="summary-card">
        <div class="label">총지출</div>
        <div id="totalExpense" class="value expense">0원</div>
      </div>
      <div class="summary-card">
        <div class="label">잔액</div>
        <div id="totalBalance" class="value balance">0원</div>
      </div>
    </section>

    <div class="actions">
      <button onclick="openEntryModal()">내역 입력</button>
      <button class="secondary" onclick="openCategoryModal()">카테고리 관리</button>
      <button class="secondary" onclick="openChartModal()">카테고리별 지출 원형차트</button>
      <button class="light" onclick="loadData()">새로고침</button>
    </div>

    <section class="calendar">
      <div class="weekdays">
        <div class="weekday">일</div>
        <div class="weekday">월</div>
        <div class="weekday">화</div>
        <div class="weekday">수</div>
        <div class="weekday">목</div>
        <div class="weekday">금</div>
        <div class="weekday">토</div>
      </div>
      <div id="calendarDays" class="days"></div>
    </section>
  </div>

  <div id="entryModal" class="modal-backdrop">
    <div class="modal">
      <h2 id="entryModalTitle">내역 입력</h2>
      <input type="hidden" id="entryId" />
      <div class="form-grid">
        <div>
          <label>날짜</label>
          <input type="date" id="entryDate" />
        </div>
        <div>
          <label>구분</label>
          <select id="entryType" onchange="renderCategorySelect()">
            <option value="income">수입</option>
            <option value="expense">지출</option>
          </select>
        </div>
        <div>
          <label>카테고리</label>
          <select id="entryCategory"></select>
        </div>
        <div>
          <label>금액</label>
          <input type="number" id="entryAmount" placeholder="예: 50000" />
        </div>
        <div class="full">
          <label>메모</label>
          <textarea id="entryMemo" placeholder="내용을 입력하세요"></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button class="danger" id="deleteEntryBtn" onclick="deleteEntry()" style="display:none;">삭제</button>
        <button class="light" onclick="closeModal('entryModal')">닫기</button>
        <button onclick="saveEntry()">저장</button>
      </div>
    </div>
  </div>

  <div id="dayModal" class="modal-backdrop">
    <div class="modal">
      <h2 id="dayModalTitle">일자별 내역</h2>
      <div id="dayEntryList" class="entry-list"></div>
      <div class="modal-actions">
        <button class="light" onclick="closeModal('dayModal')">닫기</button>
        <button onclick="openEntryModal(selectedDate)">내역 추가</button>
      </div>
    </div>
  </div>

  <div id="categoryModal" class="modal-backdrop">
    <div class="modal">
      <h2>카테고리 관리</h2>
      <div class="form-grid">
        <div>
          <label>구분</label>
          <select id="categoryType">
            <option value="expense">지출</option>
            <option value="income">수입</option>
          </select>
        </div>
        <div>
          <label>카테고리명</label>
          <input id="newCategoryName" placeholder="예: 식비" />
        </div>
      </div>
      <div class="modal-actions">
        <button onclick="addCategory()">추가</button>
      </div>
      <div id="categoryList" style="margin-top:12px;"></div>
      <div class="modal-actions">
        <button class="light" onclick="closeModal('categoryModal')">닫기</button>
      </div>
    </div>
  </div>

  <div id="chartModal" class="modal-backdrop">
    <div class="modal">
      <h2>카테고리별 지출 원형차트</h2>
      <div class="chart-wrap">
        <canvas id="categoryChart"></canvas>
      </div>
      <div id="chartEmpty" style="display:none; text-align:center; color:#6b7280; margin-top:20px;">이번 달 지출 내역이 없습니다.</div>
      <div class="modal-actions">
        <button class="light" onclick="closeModal('chartModal')">닫기</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "여기에_SUPABASE_URL_입력";
    const SUPABASE_ANON_KEY = "여기에_SUPABASE_ANON_KEY_입력";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentDate = new Date();
    let entries = [];
    let categories = [];
    let selectedDate = null;
    let chartInstance = null;

    const defaultCategories = [
      { type: "income", name: "급여" },
      { type: "income", name: "부수입" },
      { type: "expense", name: "식비" },
      { type: "expense", name: "교통" },
      { type: "expense", name: "생활용품" },
      { type: "expense", name: "통신" },
      { type: "expense", name: "기타" }
    ];

    function money(n) {
      return Number(n || 0).toLocaleString("ko-KR") + "원";
    }

    function ymd(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function monthRange() {
      const y = currentDate.getFullYear();
      const m = currentDate.getMonth();
      const start = new Date(y, m, 1);
      const end = new Date(y, m + 1, 0);
      return { start: ymd(start), end: ymd(end), y, m };
    }

    async function init() {
      await loadCategories();
      await loadData();
    }

    async function loadCategories() {
      const { data, error } = await db
        .from("moneybook_categories")
        .select("*")
        .order("type", { ascending: true })
        .order("name", { ascending: true });

      if (error) {
        alert("카테고리 조회 오류: " + error.message);
        return;
      }

      categories = data || [];

      if (categories.length === 0) {
        const { error: insertError } = await db.from("moneybook_categories").insert(defaultCategories);
        if (insertError) {
          alert("기본 카테고리 생성 오류: " + insertError.message);
          return;
        }
        await loadCategories();
        return;
      }

      renderCategorySelect();
      renderCategoryManager();
    }

    async function loadData() {
      const { start, end } = monthRange();
      const { data, error } = await db
        .from("moneybook_entries")
        .select("*")
        .gte("entry_date", start)
        .lte("entry_date", end)
        .order("entry_date", { ascending: true })
        .order("created_at", { ascending: true });

      if (error) {
        alert("내역 조회 오류: " + error.message);
        return;
      }

      entries = data || [];
      renderAll();
    }

    function renderAll() {
      renderSummary();
      renderCalendar();
    }

    function renderSummary() {
      const income = entries.filter(e => e.type === "income").reduce((s, e) => s + Number(e.amount), 0);
      const expense = entries.filter(e => e.type === "expense").reduce((s, e) => s + Number(e.amount), 0);
      document.getElementById("totalIncome").textContent = money(income);
      document.getElementById("totalExpense").textContent = money(expense);
      document.getElementById("totalBalance").textContent = money(income - expense);
    }

    function renderCalendar() {
      const { y, m } = monthRange();
      document.getElementById("monthTitle").textContent = `${y}년 ${m + 1}월`;

      const first = new Date(y, m, 1);
      const last = new Date(y, m + 1, 0);
      const firstDay = first.getDay();
      const totalDays = last.getDate();
      const wrap = document.getElementById("calendarDays");
      wrap.innerHTML = "";

      for (let i = 0; i < firstDay; i++) {
        const div = document.createElement("div");
        div.className = "day empty";
        wrap.appendChild(div);
      }

      for (let d = 1; d <= totalDays; d++) {
        const dateStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const dayEntries = entries.filter(e => e.entry_date === dateStr);
        const income = dayEntries.filter(e => e.type === "income").reduce((s, e) => s + Number(e.amount), 0);
        const expense = dayEntries.filter(e => e.type === "expense").reduce((s, e) => s + Number(e.amount), 0);

        const div = document.createElement("div");
        div.className = "day";
        div.onclick = () => openDayModal(dateStr);
        div.innerHTML = `
          <div class="date-num">${d}</div>
          <div class="day-line income"><span>수입</span><span>${income ? money(income) : "-"}</span></div>
          <div class="day-line expense"><span>지출</span><span>${expense ? money(expense) : "-"}</span></div>
          <div class="day-total">잔액 ${money(income - expense)}</div>
        `;
        wrap.appendChild(div);
      }
    }

    function moveMonth(delta) {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + delta, 1);
      loadData();
    }

    function openEntryModal(date = null, entry = null) {
      document.getElementById("entryModalTitle").textContent = entry ? "내역 수정" : "내역 입력";
      document.getElementById("entryId").value = entry?.id || "";
      document.getElementById("entryDate").value = entry?.entry_date || date || ymd(new Date());
      document.getElementById("entryType").value = entry?.type || "expense";
      document.getElementById("entryAmount").value = entry?.amount || "";
      document.getElementById("entryMemo").value = entry?.memo || "";
      renderCategorySelect(entry?.category || "");
      document.getElementById("deleteEntryBtn").style.display = entry ? "inline-block" : "none";
      document.getElementById("entryModal").classList.add("show");
    }

    function renderCategorySelect(selected = "") {
      const type = document.getElementById("entryType").value;
      const select = document.getElementById("entryCategory");
      const filtered = categories.filter(c => c.type === type);
      select.innerHTML = filtered.map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join("");
      if (selected) select.value = selected;
    }

    async function saveEntry() {
      const id = document.getElementById("entryId").value;
      const payload = {
        entry_date: document.getElementById("entryDate").value,
        type: document.getElementById("entryType").value,
        category: document.getElementById("entryCategory").value,
        amount: Number(document.getElementById("entryAmount").value),
        memo: document.getElementById("entryMemo").value.trim()
      };

      if (!payload.entry_date || !payload.category || !payload.amount || payload.amount <= 0) {
        alert("날짜, 카테고리, 금액을 정확히 입력하세요.");
        return;
      }

      let error;
      if (id) {
        ({ error } = await db.from("moneybook_entries").update(payload).eq("id", id));
      } else {
        ({ error } = await db.from("moneybook_entries").insert(payload));
      }

      if (error) {
        alert("저장 오류: " + error.message);
        return;
      }

      closeModal("entryModal");
      await loadData();
    }

    async function deleteEntry() {
      const id = document.getElementById("entryId").value;
      if (!id) return;
      if (!confirm("이 내역을 삭제할까요?")) return;

      const { error } = await db.from("moneybook_entries").delete().eq("id", id);
      if (error) {
        alert("삭제 오류: " + error.message);
        return;
      }

      closeModal("entryModal");
      await loadData();
      if (selectedDate) openDayModal(selectedDate);
    }

    function openDayModal(dateStr) {
      selectedDate = dateStr;
      const list = document.getElementById("dayEntryList");
      const dayEntries = entries.filter(e => e.entry_date === dateStr);
      document.getElementById("dayModalTitle").textContent = `${dateStr} 내역`;

      if (dayEntries.length === 0) {
        list.innerHTML = `<p style="color:#6b7280;">저장된 내역이 없습니다.</p>`;
      } else {
        list.innerHTML = dayEntries.map(e => `
          <div class="entry-row">
            <span class="${e.type === "income" ? "income" : "expense"}">${e.type === "income" ? "수입" : "지출"}</span>
            <strong>${escapeHtml(e.category)}</strong>
            <span>${escapeHtml(e.memo || "-")}</span>
            <strong>${money(e.amount)}</strong>
            <button class="light" onclick='editEntry(${JSON.stringify(e).replace(/'/g, "&#39;")})'>수정</button>
          </div>
        `).join("");
      }

      document.getElementById("dayModal").classList.add("show");
    }

    function editEntry(entry) {
      closeModal("dayModal");
      openEntryModal(null, entry);
    }

    function openCategoryModal() {
      renderCategoryManager();
      document.getElementById("categoryModal").classList.add("show");
    }

    function renderCategoryManager() {
      const wrap = document.getElementById("categoryList");
      const income = categories.filter(c => c.type === "income");
      const expense = categories.filter(c => c.type === "expense");

      wrap.innerHTML = `
        <h3>수입 카테고리</h3>
        ${income.map(categoryRow).join("") || "<p>없음</p>"}
        <h3>지출 카테고리</h3>
        ${expense.map(categoryRow).join("") || "<p>없음</p>"}
      `;
    }

    function categoryRow(c) {
      return `
        <div class="category-row">
          <div>${escapeHtml(c.name)}</div>
          <button class="danger" onclick="removeCategory('${c.id}')">제거</button>
        </div>
      `;
    }

    async function addCategory() {
      const type = document.getElementById("categoryType").value;
      const name = document.getElementById("newCategoryName").value.trim();
      if (!name) {
        alert("카테고리명을 입력하세요.");
        return;
      }

      const exists = categories.some(c => c.type === type && c.name === name);
      if (exists) {
        alert("이미 존재하는 카테고리입니다.");
        return;
      }

      const { error } = await db.from("moneybook_categories").insert({ type, name });
      if (error) {
        alert("카테고리 추가 오류: " + error.message);
        return;
      }

      document.getElementById("newCategoryName").value = "";
      await loadCategories();
    }

    async function removeCategory(id) {
      if (!confirm("카테고리를 제거할까요? 기존 내역의 카테고리명은 그대로 남습니다.")) return;
      const { error } = await db.from("moneybook_categories").delete().eq("id", id);
      if (error) {
        alert("카테고리 제거 오류: " + error.message);
        return;
      }
      await loadCategories();
    }

    function openChartModal() {
      document.getElementById("chartModal").classList.add("show");
      renderChart();
    }

    function renderChart() {
      const expenseEntries = entries.filter(e => e.type === "expense");
      const grouped = {};
      expenseEntries.forEach(e => {
        grouped[e.category] = (grouped[e.category] || 0) + Number(e.amount);
      });

      const labels = Object.keys(grouped);
      const values = Object.values(grouped);
      document.getElementById("chartEmpty").style.display = labels.length ? "none" : "block";

      const ctx = document.getElementById("categoryChart");
      if (chartInstance) chartInstance.destroy();
      if (!labels.length) return;

      chartInstance = new Chart(ctx, {
        type: "pie",
        data: {
          labels,
          datasets: [{ data: values }]
        },
        options: {
          plugins: {
            tooltip: {
              callbacks: {
                label: function(context) {
                  const total = values.reduce((a, b) => a + b, 0);
                  const value = context.raw;
                  const percent = total ? Math.round(value / total * 100) : 0;
                  return `${context.label}: ${money(value)} (${percent}%)`;
                }
              }
            }
          }
        }
      });
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("show");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    init();
  </script>
</body>
</html>
