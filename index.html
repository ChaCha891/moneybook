<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가계부</title>
  <meta name="theme-color" content="#f472b6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="가계부" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #202124;
      --muted: #6b7280;
      --line: #e5e7eb;
      --income: #2563eb;
      --expense: #dc2626;
      --balance: #059669;
      --primary: #111827;
      --pink: #f472b6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app { max-width: 1200px; margin: 0 auto; padding: 20px; }

    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); }

    h1 { margin: 0; font-size: 28px; }

    .month-control { display: flex; align-items: center; gap: 8px; }

    button { border: 0; background: var(--primary); color: white; border-radius: 10px; padding: 10px 14px; cursor: pointer; font-weight: 700; }
    button.secondary { background: #4b5563; }
    button.danger { background: #dc2626; }
    button.light { background: #e5e7eb; color: #111827; }
    button.pink { background: var(--pink); color: #111827; }

    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .summary-card { background: var(--card); border-radius: 16px; padding: 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
    .summary-card .label { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    .summary-card .value { font-size: 26px; font-weight: 900; }

    .income { color: var(--income); }
    .expense { color: var(--expense); }
    .balance { color: var(--balance); }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

    .calendar { background: var(--card); border-radius: 18px; padding: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
    .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); }
    .weekday { padding: 10px; text-align: center; color: var(--muted); font-weight: 800; border-bottom: 1px solid var(--line); }
    .day { min-height: 120px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 10px; cursor: pointer; background: white; }
    .day:nth-child(7n) { border-right: 0; }
    .day.empty { background: #f9fafb; cursor: default; }
    .date-num { font-weight: 900; margin-bottom: 8px; }
    .day-line { font-size: 13px; margin-top: 4px; display: flex; justify-content: space-between; gap: 6px; }
    .day-total { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-weight: 900; font-size: 13px; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal-backdrop.show { display: flex; }
    .modal { width: min(820px, 100%); max-height: 90vh; overflow: auto; background: white; border-radius: 18px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
    .modal h2 { margin-top: 0; }

    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    label { display: block; font-size: 14px; font-weight: 800; margin-bottom: 6px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 11px; font-size: 15px; }
    textarea { min-height: 84px; resize: vertical; }
    .full { grid-column: 1 / -1; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

    .entry-list { margin-top: 16px; border-top: 1px solid var(--line); }
    .entry-row { display: grid; grid-template-columns: 90px 90px 1fr 110px 74px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .entry-row strong { font-size: 15px; }

    .history-tools { display: grid; grid-template-columns: 1fr 160px; gap: 10px; margin-bottom: 12px; }
    .history-summary { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; color: var(--muted); font-weight: 800; }
    .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .history-table th, .history-table td { border-bottom: 1px solid var(--line); padding: 10px; text-align: left; font-size: 14px; }
    .history-table th { background: #f9fafb; }

    .category-row { display: grid; grid-template-columns: 1fr 80px; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .chart-wrap { max-width: 520px; margin: 0 auto; }

    .connection-status { display:none; margin-bottom:12px; padding:11px 13px; border-radius:12px; background:#fff7ed; border:1px solid #fdba74; color:#9a3412; font-weight:800; }
    .connection-status.show { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .account-panel { background:var(--card); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:0 6px 20px rgba(0,0,0,0.06); }
    .account-head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .account-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-top:12px; }
    .account-box { border:2px solid var(--line); background:white; color:var(--text); text-align:left; padding:14px; border-radius:14px; }
    .account-box.active { border-color:var(--pink); background:#fff1f7; }
    .account-box small { color:var(--muted); display:block; margin-bottom:6px; }
    .account-box strong { font-size:20px; }
    .transfer-list { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
    .transfer-row { display:grid; grid-template-columns:100px 1fr 120px 70px; gap:8px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
    .account-manage-row { display:grid; grid-template-columns:1fr 140px 80px; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }

    @media (max-width: 768px) {
      .app { padding: 12px; }
      .summary { grid-template-columns: 1fr; }
      .form-grid, .history-tools { grid-template-columns: 1fr; }
      .day { min-height: 96px; padding: 7px; }
      .day-line { font-size: 11px; display: block; }
      .entry-row { grid-template-columns: 1fr; gap: 4px; background: #f9fafb; border-radius: 12px; padding: 10px; margin: 8px 0; }
      .history-table { display: block; overflow-x: auto; white-space: nowrap; }
      .account-list { grid-template-columns:1fr 1fr; }
      .transfer-row, .account-manage-row { grid-template-columns:1fr; background:#f9fafb; border-radius:12px; padding:10px; margin:8px 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <img id="appIcon" class="brand-icon" src="icon-192.png" alt="가계부 아이콘" />
        <h1>가계부</h1>
      </div>
      <div class="month-control">
        <button class="light" onclick="moveMonth(-1)">◀</button>
        <h2 id="monthTitle" style="margin:0;"></h2>
        <button class="light" onclick="moveMonth(1)">▶</button>
      </div>
    </div>

    <div id="connectionStatus" class="connection-status"><span id="connectionMessage"></span><button class="light" onclick="retryConnection()">재연결</button></div>

    <section class="summary">
      <div class="summary-card"><div class="label"><span id="incomeSummaryLabel">총수입</span></div><select id="incomeSummaryCategory" onchange="renderSummary()" style="margin-bottom:8px;"></select><div id="totalIncome" class="value income">0원</div></div>
      <div class="summary-card"><div class="label"><span id="expenseSummaryLabel">총지출</span></div><select id="expenseSummaryCategory" onchange="renderSummary()" style="margin-bottom:8px;"></select><div id="totalExpense" class="value expense">0원</div></div>
      <div class="summary-card"><div class="label">잔액</div><div id="totalBalance" class="value balance">0원</div></div>
    </section>

    <section class="account-panel">
      <div class="account-head">
        <div><h2 style="margin:0 0 4px;">계좌·카드 잔액</h2><small style="color:#6b7280;">계좌를 선택하면 해당 계좌의 이체 내역을 볼 수 있습니다.</small></div>
        <div class="actions" style="margin:0;"><button style="background:#7c3aed;" onclick="openTransferModal()">이체 입력</button><button class="secondary" onclick="openAccountManageModal()">계좌 관리</button></div>
      </div>
      <div id="accountList" class="account-list"></div>
      <div id="accountTransferList" class="transfer-list"></div>
    </section>

    <div class="actions">
      <button onclick="openEntryModal()">내역 입력</button>
      <button style="background:#7c3aed;" onclick="openTransferModal()">이체 입력</button>
      <button class="secondary" onclick="openCategoryModal()">카테고리 관리</button>
      <button class="secondary" onclick="openChartModal()">카테고리별 지출 원형차트</button>
      <button class="pink" onclick="openHistoryModal()">이력관리</button>
      <button class="secondary" onclick="openFixedManageModal()">고정비 관리</button>
      <button class="light" onclick="loadData()">새로고침</button>
    </div>

    <section class="calendar">
      <div class="weekdays"><div class="weekday">일</div><div class="weekday">월</div><div class="weekday">화</div><div class="weekday">수</div><div class="weekday">목</div><div class="weekday">금</div><div class="weekday">토</div></div>
      <div id="calendarDays" class="days"></div>
    </section>
  </div>

  <div id="entryModal" class="modal-backdrop"><div class="modal">
    <h2 id="entryModalTitle">내역 입력</h2>
    <input type="hidden" id="entryId" />
    <div class="form-grid">
      <div><label>날짜</label><input type="date" id="entryDate" /></div>
      <div><label>구분</label><select id="entryType" onchange="renderCategorySelect()"><option value="income">수입</option><option value="expense">지출</option></select></div>
      <div><label>카테고리</label><select id="entryCategory"></select></div>
      <div><label>금액</label><input type="number" id="entryAmount" placeholder="예: 50000" /></div>
      <div><label>사용 계좌·카드</label><select id="entryAccount"></select></div>
      <div><label>고정비 여부</label><select id="entryFixed"><option value="false">일반 사용금액</option><option value="true">고정비</option></select></div>
      <div class="full"><label>메모</label><textarea id="entryMemo" placeholder="내용을 입력하세요"></textarea></div>
    </div>
    <div class="modal-actions"><button class="danger" id="deleteEntryBtn" onclick="deleteEntry()" style="display:none;">삭제</button><button class="light" onclick="closeModal('entryModal')">닫기</button><button onclick="saveEntry()">저장</button></div>
  </div></div>

  <div id="dayModal" class="modal-backdrop"><div class="modal">
    <h2 id="dayModalTitle">일자별 내역</h2>
    <div id="dayEntryList" class="entry-list"></div>
    <div class="modal-actions"><button class="light" onclick="closeModal('dayModal')">닫기</button><button onclick="openEntryFromDay()">내역 추가</button></div>
  </div></div>

  <div id="historyModal" class="modal-backdrop"><div class="modal">
    <h2>이력관리</h2>
    <div class="history-tools">
      <input id="historySearch" placeholder="카테고리 또는 메모 검색" oninput="renderHistoryList()" />
      <select id="historyTypeFilter" onchange="renderHistoryList()">
        <option value="all">전체</option>
        <option value="income">수입</option>
        <option value="expense">지출</option>
        <option value="transfer">이체</option>
      </select>
    </div>
    <div id="historySummary" class="history-summary"></div>
    <div id="historyList"></div>
    <div class="modal-actions"><button class="light" onclick="closeModal('historyModal')">닫기</button></div>
  </div></div>

  <div id="fixedManageModal" class="modal-backdrop"><div class="modal">
    <h2>고정비 관리</h2>
    <p style="color:#6b7280; margin-top:-6px;">고정비/적금처럼 매월 반복되는 항목을 등록하고, 이체완료를 누르면 해당 월 지출 내역으로 반영됩니다.</p>
    <div class="modal-actions" style="justify-content:flex-start;"><button onclick="openFixedItemModal()">내용 추가</button></div>
    <div id="fixedItemList" class="entry-list"></div>
    <div class="modal-actions"><button class="light" onclick="closeModal('fixedManageModal')">닫기</button></div>
  </div></div>

  <div id="fixedItemModal" class="modal-backdrop"><div class="modal">
    <h2 id="fixedItemModalTitle">고정비 추가</h2>
    <input type="hidden" id="fixedItemId" />
    <div class="form-grid">
      <div><label>카테고리</label><select id="fixedItemCategory"></select></div>
      <div><label>출금 계좌·카드</label><select id="fixedItemAccount"></select></div>
      <div><label>금액</label><input type="number" id="fixedItemAmount" placeholder="예: 50000" /></div>
      <div><label>메모</label><input id="fixedItemMemo" placeholder="예: 통신비, 청약, 보험료" /></div>
    </div>
    <div class="modal-actions"><button class="danger" id="deleteFixedItemBtn" onclick="deleteFixedItem()" style="display:none;">삭제</button><button class="light" onclick="closeModal('fixedItemModal')">닫기</button><button onclick="saveFixedItem()">저장</button></div>
  </div></div>

  <div id="categoryModal" class="modal-backdrop"><div class="modal">
    <h2>카테고리 관리</h2>
    <div class="form-grid">
      <div><label>구분</label><select id="categoryType"><option value="expense">지출</option><option value="income">수입</option></select></div>
      <div><label>카테고리명</label><input id="newCategoryName" placeholder="예: 식비" /></div>
    </div>
    <div class="modal-actions"><button onclick="addCategory()">추가</button></div>
    <div id="categoryList" style="margin-top:12px;"></div>
    <div class="modal-actions"><button class="light" onclick="closeModal('categoryModal')">닫기</button></div>
  </div></div>

  <div id="chartModal" class="modal-backdrop"><div class="modal">
    <h2>카테고리별 지출 원형차트</h2>
    <div class="chart-wrap"><canvas id="categoryChart"></canvas></div>
    <div id="chartEmpty" style="display:none; text-align:center; color:#6b7280; margin-top:20px;">이번 달 지출 내역이 없습니다.</div>
    <div class="modal-actions"><button class="light" onclick="closeModal('chartModal')">닫기</button></div>
  </div></div>

  <div id="transferModal" class="modal-backdrop"><div class="modal">
    <h2 id="transferModalTitle">계좌 간 이체</h2>
    <input type="hidden" id="transferId" />
    <div class="form-grid">
      <div><label>날짜</label><input type="date" id="transferDate" /></div>
      <div><label>금액</label><input type="number" id="transferAmount" min="1" placeholder="예: 100000" /></div>
      <div><label>보낸 계좌·카드</label><select id="transferFrom"></select></div>
      <div><label>받은 계좌·카드</label><select id="transferTo"></select></div>
      <div class="full"><label>메모</label><textarea id="transferMemo" placeholder="예: 신한카드 결제대금 이체"></textarea></div>
    </div>
    <div class="modal-actions"><button class="danger" id="deleteTransferBtn" onclick="deleteTransfer()" style="display:none;">삭제</button><button class="light" onclick="closeModal('transferModal')">닫기</button><button style="background:#7c3aed;" onclick="saveTransfer()">저장</button></div>
  </div></div>

  <div id="accountManageModal" class="modal-backdrop"><div class="modal">
    <h2>계좌·카드 관리</h2>
    <div class="form-grid">
      <div><label>새 계좌·카드 이름</label><input id="newAccountName" placeholder="예: 국민은행 통장" /></div>
      <div><label>시작 잔액</label><input type="number" id="newAccountBalance" value="0" /></div>
    </div>
    <div class="modal-actions"><button onclick="addAccount()">추가</button></div>
    <div id="accountManageList" class="entry-list"></div>
    <div class="modal-actions"><button class="light" onclick="closeModal('accountManageModal')">닫기</button></div>
  </div></div>

  <script>
    const SUPABASE_URL = "https://yajvtppzhajpexvpqvnv.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhanZ0cHB6aGFqcGV4dnBxdm52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NzA1MTksImV4cCI6MjA5NDQ0NjUxOX0.D4bRjAgYBqsVuOeJYk0v0gaaStr5QRm6TSHa3NHYTao";
    const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let currentDate = new Date();
    let entries = [];
    let allEntries = [];
    let categories = [];
    let selectedDate = null;
    let chartInstance = null;
    let fixedItems = [];
    let selectedAccountId = "all";
    let cloudOnline = true;
    let accountConfigId = null;

    const ACCOUNT_STORE = "moneybook_accounts_v2";
    const CACHE_STORE = "moneybook_offline_cache_v2";
    const ACCOUNT_CONFIG_CATEGORY = "__MONEYBOOK_ACCOUNT_CONFIG__";
    let accounts = JSON.parse(localStorage.getItem(ACCOUNT_STORE) || "null") || [
      { id: "nh_check", name: "농협 체크카드", openingBalance: 0, active: true },
      { id: "toss_check", name: "토스체크카드", openingBalance: 0, active: true },
      { id: "shinhan_credit", name: "신한신용카드", openingBalance: 0, active: true }
    ];

    const defaultCategories = [
      { type: "income", name: "급여" }, { type: "income", name: "부수입" },
      { type: "expense", name: "식비" }, { type: "expense", name: "교통" },
      { type: "expense", name: "생활용품" }, { type: "expense", name: "통신" }, { type: "expense", name: "기타" }
    ];

    function money(n) { return Number(n || 0).toLocaleString("ko-KR") + "원"; }
    function ymd(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`; }
    function monthRange() { const y=currentDate.getFullYear(), m=currentDate.getMonth(); return { start: ymd(new Date(y,m,1)), end: ymd(new Date(y,m+1,0)), y, m }; }

    function uid() { return crypto.randomUUID?.() || `id_${Date.now()}_${Math.random().toString(16).slice(2)}`; }
    function saveAccounts() { localStorage.setItem(ACCOUNT_STORE, JSON.stringify(accounts)); persistAccounts(); }
    function activeAccounts() { return accounts.filter(a => a.active !== false); }
    function accountName(id) { return accounts.find(a => a.id === id)?.name || "계좌 미지정"; }
    function cacheData(patch) { const old = JSON.parse(localStorage.getItem(CACHE_STORE) || "{}"); localStorage.setItem(CACHE_STORE, JSON.stringify({ ...old, ...patch })); }
    function cachedData() { return JSON.parse(localStorage.getItem(CACHE_STORE) || "{}"); }
    function showOffline(error) { cloudOnline = false; connectionMessage.textContent = `온라인 저장소 연결 실패로 이 기기에 임시 저장합니다. (${error?.message || "Failed to fetch"})`; connectionStatus.classList.add("show"); }
    function showOnline() { cloudOnline = true; connectionStatus.classList.remove("show"); }
    function packMemo(text, meta) { const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(meta || {})))); return `${String(text || "").trim()}\n[[MBMETA:${encoded}]]`.trim(); }
    function unpackMemo(value) { const text = String(value || ""), match = text.match(/\n?\[\[MBMETA:([^\]]+)\]\]\s*$/); if (!match) return { text, meta: {} }; try { return { text: text.slice(0, match.index).trim(), meta: JSON.parse(decodeURIComponent(escape(atob(match[1])))) }; } catch { return { text, meta: {} }; } }
    function entryMeta(e) { return unpackMemo(e?.memo).meta; }
    function visibleMemo(e) { return unpackMemo(e?.memo).text; }
    function entryAccountId(e) { return entryMeta(e).accountId || ""; }
    function accountOptions(selected = "", allowBlank = true) { return (allowBlank ? `<option value="">계좌 미지정</option>` : "") + activeAccounts().map(a => `<option value="${a.id}" ${a.id === selected ? "selected" : ""}>${escapeHtml(a.name)}</option>`).join(""); }

    function createPigIcon(size = 512) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 512 512"><rect width="512" height="512" rx="108" fill="#fce7f3"/><ellipse cx="260" cy="276" rx="160" ry="115" fill="#f9a8d4"/><circle cx="382" cy="250" r="46" fill="#f9a8d4"/><circle cx="404" cy="248" r="23" fill="#fce7f3"/><circle cx="397" cy="248" r="5" fill="#111827"/><circle cx="413" cy="248" r="5" fill="#111827"/><circle cx="210" cy="230" r="13" fill="#111827"/><path d="M158 184 L125 132 Q119 121 132 120 L196 137" fill="#f9a8d4" stroke="#111827" stroke-width="10" stroke-linejoin="round"/><path d="M275 166 L306 111 Q314 99 324 111 L352 171" fill="#f9a8d4" stroke="#111827" stroke-width="10" stroke-linejoin="round"/><rect x="198" y="163" width="126" height="20" rx="10" fill="#111827" opacity=".85"/><path d="M151 336 Q207 378 287 361" fill="none" stroke="#111827" stroke-width="11" stroke-linecap="round"/><rect x="160" y="371" width="45" height="55" rx="18" fill="#111827" opacity=".85"/><rect x="302" y="365" width="45" height="61" rx="18" fill="#111827" opacity=".85"/><text x="256" y="92" text-anchor="middle" font-size="52" font-family="Arial" font-weight="900" fill="#111827">₩</text></svg>`;
      return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
    }

    function setupPWA() {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    }

    async function init() { setupPWA(); if (!db) showOffline(new Error("연결 모듈을 불러오지 못했습니다")); await loadCategories(); await loadAccounts(); await loadFixedItems(); await loadData(); }

    async function retryConnection() { if (!db) { showOffline(new Error("연결 모듈을 불러오지 못했습니다")); return; } cloudOnline = true; await loadCategories(); await loadAccounts(); await loadFixedItems(); await loadData(); }

    async function loadAccounts() {
      if (!cloudOnline || !db) { renderAccounts(); return; }
      try {
        const { data, error } = await db.from("moneybook_entries").select("*").eq("category", ACCOUNT_CONFIG_CATEGORY).limit(1);
        if (error) throw error;
        if (data?.length) { accountConfigId = data[0].id; const saved=entryMeta(data[0]).accounts; if(Array.isArray(saved)&&saved.length) accounts=saved; localStorage.setItem(ACCOUNT_STORE,JSON.stringify(accounts)); }
        else await persistAccounts();
      } catch(error) { showOffline(error); }
      renderAccounts();
    }

    async function persistAccounts() {
      if (!cloudOnline || !db) return;
      const payload={entry_date:"1900-01-01",type:"income",category:ACCOUNT_CONFIG_CATEGORY,amount:1,is_fixed:false,memo:packMemo("",{kind:"account_config",accounts})};
      try {
        if(accountConfigId){const {error}=await db.from("moneybook_entries").update(payload).eq("id",accountConfigId);if(error)throw error;}
        else{const {data,error}=await db.from("moneybook_entries").insert(payload).select().single();if(error)throw error;accountConfigId=data.id;}
      } catch(error){showOffline(error);}
    }

    async function loadCategories() {
      if (!cloudOnline || !db) { categories = (cachedData().categories || defaultCategories).map((c,i)=>({...c,id:c.id||`local_${c.type}_${i}`})); renderCategorySelect(); renderCategoryManager(); return; }
      try {
      const { data, error } = await db.from("moneybook_categories").select("*").order("type", { ascending: true }).order("name", { ascending: true });
      if (error) throw error;
      categories = data || []; showOnline(); cacheData({ categories });
      if (categories.length === 0) {
        const { error: insertError } = await db.from("moneybook_categories").insert(defaultCategories);
        if (insertError) throw insertError;
        await loadCategories(); return;
      }
      renderCategorySelect(); renderCategoryManager();
      } catch (error) {
        showOffline(error); categories = (cachedData().categories || defaultCategories).map((c,i)=>({...c,id:c.id||`local_${c.type}_${i}`})); renderCategorySelect(); renderCategoryManager();
      }
    }

    async function loadData() {
      if (!cloudOnline || !db) { allEntries = cachedData().entries || allEntries || []; const { start, end } = monthRange(); entries = allEntries.filter(e => e.entry_date >= start && e.entry_date <= end); renderAll(); return; }
      try {
      const { start, end } = monthRange();
      const { data, error } = await db.from("moneybook_entries").select("*").order("entry_date", { ascending: true }).order("created_at", { ascending: true });
      if (error) throw error;
      allEntries = (data || []).filter(e => e.category !== ACCOUNT_CONFIG_CATEGORY); entries = allEntries.filter(e => e.entry_date >= start && e.entry_date <= end); cacheData({ entries: allEntries }); showOnline(); renderAll();
      } catch (error) {
        showOffline(error); allEntries = cachedData().entries || []; const { start, end } = monthRange(); entries = allEntries.filter(e => e.entry_date >= start && e.entry_date <= end); renderAll();
      }
    }

    function renderAll() { renderSummary(); renderCalendar(); renderAccounts(); }
    function entryCategoryName(e) {
      return String(e.category || "").trim();
    }

    function isTransferEntry(e) {
      return e.type === "expense" && entryCategoryName(e) === "돈옮김" && (entryMeta(e).kind === "transfer" || !entryMeta(e).kind);
    }

    function isSavingEntry(e) {
      return e.type === "expense" && entryCategoryName(e) === "적금";
    }

    function isFixedEntry(e) {
      const fixedValue = e.is_fixed;
      const fixedChecked = fixedValue === true || fixedValue === "true" || fixedValue === 1 || fixedValue === "1";
      const fixedCategory = entryCategoryName(e) === "고정비";
      return e.type === "expense" && (fixedChecked || fixedCategory);
    }

    function isSpecialBalanceOnlyEntry(e) {
      return isFixedEntry(e) || isSavingEntry(e) || isTransferEntry(e);
    }

    function isUserSpendEntry(e) {
      return e.type === "expense" && !isSpecialBalanceOnlyEntry(e);
    }

    function getEntryTypeLabel(e) {
      if (e.type === "income") return "수입";
      if (isFixedEntry(e)) return "고정비";
      if (isSavingEntry(e)) return "적금";
      if (isTransferEntry(e)) return "돈옮김";
      return "지출";
    }

    function getEntryTypeBadgeStyle(e) {
      if (e.type === "income") return "background:#dbeafe; color:#1d4ed8;";
      if (isFixedEntry(e)) return "background:#dbeafe; color:#1d4ed8;";
      if (isSavingEntry(e)) return "background:#dcfce7; color:#15803d;";
      if (isTransferEntry(e)) return "background:#ede9fe; color:#6d28d9;";
      return "background:#f3f4f6; color:#111827;";
    }

    function entryTypeBadge(e) {
      return `<span style="display:inline-block; padding:4px 10px; border-radius:999px; font-weight:800; ${getEntryTypeBadgeStyle(e)}">${getEntryTypeLabel(e)}</span>`;
    }

    function getEntryRowBgStyle(e) {
      if (e.type === "income") return "background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe;";
      if (isFixedEntry(e)) return "background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe;";
      if (isSavingEntry(e)) return "background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0;";
      if (isTransferEntry(e)) return "background:#f5f3ff; color:#6d28d9; border:1px solid #ddd6fe;";
      return "background:#f9fafb; color:#111827; border:1px solid #e5e7eb;";
    }

    function renderSummary() {
      renderSummaryCategoryOptions();

      const incomeCategory = incomeSummaryCategory.value;
      const expenseCategory = expenseSummaryCategory.value;

      const incomeList = entries.filter(e => e.type === "income" && (incomeCategory === "all" || e.category === incomeCategory));
      const expenseList = entries.filter(e => {
        if (e.type !== "expense") return false;
        if (expenseCategory === "all") return isUserSpendEntry(e);
        return e.category === expenseCategory;
      });

      const totalIncomeAll = entries.filter(e => e.type === "income").reduce((s,e)=>s+Number(e.amount),0);
      const balanceExpenseAll = entries.filter(e => e.type === "expense" && !isTransferEntry(e)).reduce((s,e)=>s+Number(e.amount),0);
      const income = incomeList.reduce((s,e)=>s+Number(e.amount),0);
      const expense = expenseList.reduce((s,e)=>s+Number(e.amount),0);

      incomeSummaryLabel.textContent = incomeCategory === "all" ? "총수입" : incomeCategory;
      expenseSummaryLabel.textContent = expenseCategory === "all" ? "총지출" : expenseCategory;
      totalIncome.textContent = money(income);
      totalExpense.textContent = money(expense);
      totalBalance.textContent = money(totalIncomeAll - balanceExpenseAll);
    }

    function renderSummaryCategoryOptions() {
      const prevIncome = incomeSummaryCategory.value || "all";
      const prevExpense = expenseSummaryCategory.value || "all";
      const incomeCategories = categories.filter(c => c.type === "income").map(c => c.name);
      const expenseCategories = categories.filter(c => c.type === "expense").map(c => c.name);

      incomeSummaryCategory.innerHTML = `<option value="all">전체 수입</option>` + incomeCategories.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("");
      expenseSummaryCategory.innerHTML = `<option value="all">전체 사용금액</option>` + expenseCategories.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("");

      incomeSummaryCategory.value = incomeCategories.includes(prevIncome) ? prevIncome : "all";
      expenseSummaryCategory.value = expenseCategories.includes(prevExpense) ? prevExpense : "all";
    }

    function renderCalendar() {
      const { y, m } = monthRange(); monthTitle.textContent = `${y}년 ${m + 1}월`;
      const first = new Date(y, m, 1), last = new Date(y, m + 1, 0), firstDay = first.getDay(), totalDays = last.getDate();
      calendarDays.innerHTML = "";
      for (let i = 0; i < firstDay; i++) { const div=document.createElement("div"); div.className="day empty"; calendarDays.appendChild(div); }
      for (let d = 1; d <= totalDays; d++) {
        const dateStr = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const dayEntries = entries.filter(e => e.entry_date === dateStr);
        const income = dayEntries.filter(e=>e.type==="income").reduce((s,e)=>s+Number(e.amount),0);
        const expense = dayEntries.filter(e=>isUserSpendEntry(e)).reduce((s,e)=>s+Number(e.amount),0);
        const fixed = dayEntries.filter(e=>isFixedEntry(e)).reduce((s,e)=>s+Number(e.amount),0);
        const div=document.createElement("div"); div.className="day"; div.onclick=()=>openDayModal(dateStr);
        div.innerHTML = `<div class="date-num">${d}</div><div class="day-line income"><span>수입</span><span>${income?money(income):"-"}</span></div><div class="day-line expense"><span>사용금액</span><span>${expense?money(expense):"-"}</span></div><div class="day-line" style="color:#2563eb;font-weight:900;"><span>고정비</span><span>${fixed?money(fixed):"-"}</span></div>`;
        calendarDays.appendChild(div);
      }
    }

    function moveMonth(delta) { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + delta, 1); const { start, end } = monthRange(); entries = allEntries.filter(e => e.entry_date >= start && e.entry_date <= end); renderAll(); }

    function openEntryModal(date = null, entry = null) {
      entryModalTitle.textContent = entry ? "내역 수정" : "내역 입력";
      entryId.value = entry?.id || ""; entryDate.value = entry?.entry_date || date || ymd(new Date()); entryType.value = entry?.type || "expense"; entryAmount.value = entry?.amount || ""; entryFixed.value = entry?.is_fixed === true ? "true" : "false"; entryMemo.value = entry ? visibleMemo(entry) : ""; entryAccount.innerHTML = accountOptions(entry ? entryAccountId(entry) : "", true);
      renderCategorySelect(entry?.category || ""); deleteEntryBtn.style.display = entry ? "inline-block" : "none"; entryModal.classList.add("show");
    }

    function renderCategorySelect(selected = "") {
      const type = entryType?.value || "expense"; const filtered = categories.filter(c => c.type === type);
      entryCategory.innerHTML = filtered.map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join(""); if (selected) entryCategory.value = selected;
    }

    async function saveEntry() {
      const id = entryId.value;
      const payload = { entry_date: entryDate.value, type: entryType.value, category: entryCategory.value, amount: Number(entryAmount.value), is_fixed: entryType.value === "expense" && entryFixed.value === "true", memo: packMemo(entryMemo.value, { kind: "entry", accountId: entryAccount.value }) };
      if (!payload.entry_date || !payload.category || !payload.amount || payload.amount <= 0) { alert("날짜, 카테고리, 금액을 정확히 입력하세요."); return; }
      try {
      let error; if (id) ({ error } = await db.from("moneybook_entries").update(payload).eq("id", id)); else ({ error } = await db.from("moneybook_entries").insert(payload));
      if (error) throw error;
      } catch (error) {
        showOffline(error); if (id) { const i=allEntries.findIndex(e=>String(e.id)===String(id)); if(i>=0) allEntries[i]={...allEntries[i],...payload}; } else allEntries.push({...payload,id:uid(),created_at:new Date().toISOString()}); cacheData({entries:allEntries});
      }
      closeModal("entryModal"); await loadData();
    }

    async function deleteEntry() {
      const id = entryId.value; if (!id) return; if (!confirm("이 내역을 삭제할까요?")) return;
      try { const { error } = await db.from("moneybook_entries").delete().eq("id", id); if (error) throw error; } catch (error) { showOffline(error); allEntries=allEntries.filter(e=>String(e.id)!==String(id)); cacheData({entries:allEntries}); }
      closeModal("entryModal"); await loadFixedItems(); await loadData(); if (selectedDate) openDayModal(selectedDate); if (fixedManageModal.classList.contains("show")) renderFixedItemList();
    }

    function openDayModal(dateStr) {
      selectedDate = dateStr; const dayEntries = entries.filter(e => e.entry_date === dateStr); dayModalTitle.textContent = `${dateStr} 내역`;
      dayEntryList.innerHTML = dayEntries.length ? dayEntries.map(e => `<div class="entry-row" style="${getEntryRowBgStyle(e)}"><span>${entryTypeBadge(e)}</span><strong>${escapeHtml(e.category)}</strong><span>${escapeHtml(isTransferEntry(e) ? `${accountName(entryMeta(e).fromAccountId)} → ${accountName(entryMeta(e).toAccountId)}` : accountName(entryAccountId(e)))}<br><small>${escapeHtml(visibleMemo(e) || "-")}</small></span><strong>${money(e.amount)}</strong><button class="light" onclick='${isTransferEntry(e) ? "editTransfer" : "editEntry"}(${JSON.stringify(e).replace(/'/g, "&#39;")})'>수정</button></div>`).join("") : `<p style="color:#6b7280;">저장된 내역이 없습니다.</p>`;
      dayModal.classList.add("show");
    }
    function editEntry(entry) { closeModal("dayModal"); closeModal("historyModal"); openEntryModal(null, entry); }
    function openEntryFromDay(){ closeModal("dayModal"); openEntryModal(selectedDate); }

    function accountBalance(accountId) {
      const account = accounts.find(a => a.id === accountId);
      let balance = Number(account?.openingBalance || 0);
      allEntries.forEach(e => {
        const meta = entryMeta(e);
        if (isTransferEntry(e)) {
          if (meta.fromAccountId === accountId) balance -= Number(e.amount || 0);
          if (meta.toAccountId === accountId) balance += Number(e.amount || 0);
        } else if (meta.accountId === accountId) {
          balance += (e.type === "income" ? 1 : -1) * Number(e.amount || 0);
        }
      });
      return balance;
    }

    function renderAccounts() {
      const active = activeAccounts();
      if (selectedAccountId !== "all" && !active.some(a => a.id === selectedAccountId)) selectedAccountId = "all";
      const total = active.reduce((sum, a) => sum + accountBalance(a.id), 0);
      accountList.innerHTML = `<button class="account-box ${selectedAccountId === "all" ? "active" : ""}" onclick="selectAccount('all')"><small>전체 계좌·카드</small><strong class="${total < 0 ? "expense" : "balance"}">${money(total)}</strong></button>` + active.map(a => {
        const value = accountBalance(a.id);
        return `<button class="account-box ${selectedAccountId === a.id ? "active" : ""}" onclick="selectAccount('${a.id}')"><small>${escapeHtml(a.name)}</small><strong class="${value < 0 ? "expense" : "balance"}">${money(value)}</strong></button>`;
      }).join("");
      renderAccountTransfers();
    }

    function selectAccount(id) { selectedAccountId = id; renderAccounts(); }

    function renderAccountTransfers() {
      let list = allEntries.filter(isTransferEntry).sort((a,b) => a.entry_date < b.entry_date ? 1 : -1);
      if (selectedAccountId !== "all") list = list.filter(e => { const m=entryMeta(e); return m.fromAccountId === selectedAccountId || m.toAccountId === selectedAccountId; });
      const title = selectedAccountId === "all" ? "전체 이체 내역" : `${accountName(selectedAccountId)} 이체 내역`;
      accountTransferList.innerHTML = `<h3 style="margin:0 0 8px;">${escapeHtml(title)}</h3>` + (list.length ? list.map(e => {
        const m = entryMeta(e);
        return `<div class="transfer-row"><span>${e.entry_date}</span><span><strong>${escapeHtml(accountName(m.fromAccountId))}</strong> → <strong>${escapeHtml(accountName(m.toAccountId))}</strong><br><small>${escapeHtml(visibleMemo(e) || "-")}</small></span><strong style="color:#7c3aed;">${money(e.amount)}</strong><button class="light" onclick='editTransfer(${JSON.stringify(e).replace(/'/g,"&#39;")})'>수정</button></div>`;
      }).join("") : `<p style="color:#6b7280;text-align:center;">저장된 이체 내역이 없습니다.</p>`);
    }

    function openTransferModal(date = null, entry = null) {
      if (activeAccounts().length < 2) { alert("이체를 입력하려면 계좌·카드를 2개 이상 등록하세요."); return; }
      const meta = entry ? entryMeta(entry) : {};
      transferModalTitle.textContent = entry ? "이체 수정" : "계좌 간 이체";
      transferId.value = entry?.id || ""; transferDate.value = entry?.entry_date || date || ymd(new Date()); transferAmount.value = entry?.amount || "";
      transferFrom.innerHTML = accountOptions(meta.fromAccountId || activeAccounts()[0]?.id, false);
      transferTo.innerHTML = accountOptions(meta.toAccountId || activeAccounts()[1]?.id, false);
      transferMemo.value = entry ? visibleMemo(entry) : ""; deleteTransferBtn.style.display = entry ? "inline-block" : "none"; transferModal.classList.add("show");
    }

    function editTransfer(entry) { closeModal("dayModal"); closeModal("historyModal"); openTransferModal(null, entry); }

    async function saveTransfer() {
      const id=transferId.value, from=transferFrom.value, to=transferTo.value, amount=Number(transferAmount.value);
      if (!transferDate.value || !from || !to || from === to || amount <= 0) { alert("보낸 계좌와 받은 계좌를 다르게 선택하고 금액을 확인하세요."); return; }
      const payload = { entry_date:transferDate.value, type:"expense", category:"돈옮김", amount, is_fixed:false, memo:packMemo(transferMemo.value,{kind:"transfer",fromAccountId:from,toAccountId:to}) };
      try { let error; if(id) ({error}=await db.from("moneybook_entries").update(payload).eq("id",id)); else ({error}=await db.from("moneybook_entries").insert(payload)); if(error) throw error; }
      catch(error) { showOffline(error); if(id){const i=allEntries.findIndex(e=>String(e.id)===String(id));if(i>=0)allEntries[i]={...allEntries[i],...payload};}else allEntries.push({...payload,id:uid(),created_at:new Date().toISOString()});cacheData({entries:allEntries}); }
      closeModal("transferModal"); await loadData();
    }

    async function deleteTransfer() {
      const id=transferId.value; if(!id || !confirm("이 이체 내역을 삭제할까요?")) return;
      try { const {error}=await db.from("moneybook_entries").delete().eq("id",id); if(error) throw error; }
      catch(error) { showOffline(error); allEntries=allEntries.filter(e=>String(e.id)!==String(id)); cacheData({entries:allEntries}); }
      closeModal("transferModal"); await loadData();
    }

    function openAccountManageModal() { renderAccountManager(); accountManageModal.classList.add("show"); }
    function renderAccountManager() { accountManageList.innerHTML = activeAccounts().map(a => `<div class="account-manage-row"><input value="${escapeHtml(a.name)}" onchange="updateAccount('${a.id}','name',this.value)"><input type="number" value="${Number(a.openingBalance || 0)}" onchange="updateAccount('${a.id}','openingBalance',this.value)"><button class="danger" onclick="removeAccount('${a.id}')">제거</button></div>`).join(""); }
    function addAccount() { const name=newAccountName.value.trim(); if(!name){alert("계좌·카드 이름을 입력하세요.");return;} if(activeAccounts().some(a=>a.name===name)){alert("같은 이름이 이미 있습니다.");return;} accounts.push({id:uid(),name,openingBalance:Number(newAccountBalance.value||0),active:true}); saveAccounts(); newAccountName.value="";newAccountBalance.value=0;renderAccountManager();renderAccounts(); }
    function updateAccount(id,key,value) { const a=accounts.find(x=>x.id===id); if(!a)return; a[key]=key==="openingBalance"?Number(value||0):String(value).trim(); saveAccounts(); renderAccounts(); }
    function removeAccount(id) { const a=accounts.find(x=>x.id===id); if(!a||!confirm(`'${a.name}'을 목록에서 제거할까요? 기존 내역은 유지됩니다.`))return; a.active=false; saveAccounts(); renderAccountManager(); renderAccounts(); }

    function openHistoryModal() { historySearch.value = ""; historyTypeFilter.value = "all"; renderHistoryList(); historyModal.classList.add("show"); }
    function renderHistoryList() {
      const keyword = historySearch.value.trim().toLowerCase(); const type = historyTypeFilter.value;
      let list = [...entries].sort((a,b) => (a.entry_date < b.entry_date ? 1 : -1));
      if (type !== "all") list = list.filter(e => type === "transfer" ? isTransferEntry(e) : e.type === type && !isTransferEntry(e));
      if (keyword) list = list.filter(e => { const m=entryMeta(e), accountText=isTransferEntry(e)?`${accountName(m.fromAccountId)} ${accountName(m.toAccountId)}`:accountName(m.accountId); return `${e.category} ${visibleMemo(e)} ${accountText}`.toLowerCase().includes(keyword); });
      const income = list.filter(e=>e.type==="income").reduce((s,e)=>s+Number(e.amount),0);
      const spendExpense = list.filter(e=>isUserSpendEntry(e)).reduce((s,e)=>s+Number(e.amount),0);
      const balanceExpense = list.filter(e=>e.type==="expense"&&!isTransferEntry(e)).reduce((s,e)=>s+Number(e.amount),0);
      historySummary.innerHTML = `<span>검색결과 ${list.length}건</span><span class="income">수입 ${money(income)}</span><span class="expense">사용금액 ${money(spendExpense)}</span><span class="balance">잔액 ${money(income-balanceExpense)}</span>`;
      historyList.innerHTML = list.length ? `<table class="history-table"><thead><tr><th>날짜</th><th>구분</th><th>카테고리</th><th>계좌·카드</th><th>메모</th><th>금액</th><th>관리</th></tr></thead><tbody>${list.map(e => { const m=entryMeta(e), accountText=isTransferEntry(e)?`${accountName(m.fromAccountId)} → ${accountName(m.toAccountId)}`:accountName(m.accountId); return `<tr><td>${e.entry_date}</td><td>${entryTypeBadge(e)}</td><td>${escapeHtml(e.category)}</td><td>${escapeHtml(accountText)}</td><td>${escapeHtml(visibleMemo(e) || "-")}</td><td><strong>${money(e.amount)}</strong></td><td><button class="light" onclick='${isTransferEntry(e)?"editTransfer":"editEntry"}(${JSON.stringify(e).replace(/'/g, "&#39;")})'>수정</button></td></tr>`; }).join("")}</tbody></table>` : `<p style="color:#6b7280; text-align:center; padding:20px;">검색 결과가 없습니다.</p>`;
    }

    function openCategoryModal() { renderCategoryManager(); categoryModal.classList.add("show"); }
    function renderCategoryManager() { const income=categories.filter(c=>c.type==="income"), expense=categories.filter(c=>c.type==="expense"); categoryList.innerHTML = `<h3>수입 카테고리</h3>${income.map(categoryRow).join("") || "<p>없음</p>"}<h3>지출 카테고리</h3>${expense.map(categoryRow).join("") || "<p>없음</p>"}`; }
    function categoryRow(c) { return `<div class="category-row"><div>${escapeHtml(c.name)}</div><button class="danger" onclick="removeCategory('${c.id}')">제거</button></div>`; }
    async function addCategory() { const type=categoryType.value, name=newCategoryName.value.trim(); if(!name){alert("카테고리명을 입력하세요.");return;} if(categories.some(c=>c.type===type&&c.name===name)){alert("이미 존재하는 카테고리입니다.");return;} if(cloudOnline&&db){try{const {error}=await db.from("moneybook_categories").insert({type,name});if(error)throw error;newCategoryName.value="";await loadCategories();return;}catch(error){showOffline(error);}} categories.push({id:uid(),type,name});cacheData({categories});newCategoryName.value="";renderCategoryManager();renderCategorySelect(); }
    async function removeCategory(id) { if(!confirm("카테고리를 제거할까요? 기존 내역의 카테고리명은 그대로 남습니다."))return; if(cloudOnline&&db){try{const {error}=await db.from("moneybook_categories").delete().eq("id",id);if(error)throw error;await loadCategories();return;}catch(error){showOffline(error);}} categories=categories.filter(c=>String(c.id)!==String(id));cacheData({categories});renderCategoryManager();renderCategorySelect(); }

    async function loadFixedItems() {
      if (!cloudOnline || !db) { fixedItems = cachedData().fixedItems || fixedItems || []; return; }
      try {
        const { data, error } = await db.from("moneybook_fixed_items").select("*").order("transfer_day", { ascending: true }).order("created_at", { ascending: true });
        if (error) throw error;
        fixedItems = data || []; cacheData({ fixedItems });
      } catch (error) {
        showOffline(error); fixedItems = cachedData().fixedItems || [];
      }
    }

    function openFixedManageModal() {
      renderFixedItemList();
      fixedManageModal.classList.add("show");
    }

    function renderFixedCategorySelect(selected = "") {
      const expenseCategories = categories.filter(c => c.type === "expense").map(c => c.name);
      fixedItemCategory.innerHTML = expenseCategories.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("");
      if (selected) fixedItemCategory.value = selected;
    }

    function openFixedItemModal(item = null) {
      fixedItemModalTitle.textContent = item ? "고정비 수정" : "고정비 추가";
      fixedItemId.value = item?.id || "";
      renderFixedCategorySelect(item?.category || "");
      fixedItemAccount.innerHTML = accountOptions(item ? entryMeta(item).accountId : "", false);
      fixedItemAmount.value = item?.amount || "";
      fixedItemMemo.value = item ? visibleMemo(item) : "";
      deleteFixedItemBtn.style.display = item ? "inline-block" : "none";
      fixedItemModal.classList.add("show");
    }

    function renderFixedItemList() {
      if (!fixedItems.length) {
        fixedItemList.innerHTML = `<p style="color:#6b7280;">등록된 고정비/적금 항목이 없습니다.</p>`;
        return;
      }

      const currentMonth = `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,"0")}`;
      const totalFixed = fixedItems.reduce((s,i)=>s+Number(i.amount||0),0);

      fixedItemList.innerHTML = fixedItems.map(item => {
        const completed = entries.some(e =>
          isFixedEntry(e) &&
          String(e.entry_date || "").startsWith(currentMonth) &&
          e.category === item.category &&
          Number(e.amount) === Number(item.amount)
        );

        const safeItem = JSON.stringify(item).replace(/'/g,"&#39;");
        const transferDay = Number(item.transfer_day || 1);

        return `
        <div class="entry-row" style="${completed ? 'background:#f0fdf4;' : ''}">
          <span>
            <input
              type="number"
              min="1"
              max="31"
              value="${transferDay}"
              id="fixedDay_${item.id}"
              style="width:54px; padding:6px; text-align:center; font-weight:900; color:#dc2626; border:1px solid #fecaca;"
              ${completed ? "disabled" : ""}
            />
            <strong style="color:#dc2626;">일</strong>
          </span>
          <strong>${escapeHtml(item.category)}</strong>
          <span>${escapeHtml(accountName(entryMeta(item).accountId))}<br><small>${escapeHtml(visibleMemo(item) || "-")}</small></span>
          <strong>${money(item.amount)}</strong>
          <div style="display:flex;gap:6px;flex-wrap:nowrap;">
            <button class="light" onclick='openFixedItemModal(${safeItem})'>수정</button>
            ${completed ? '<button disabled style="background:#16a34a">완료</button>' : `<button onclick='completeFixedTransfer(${safeItem})'>이체완료</button>`}
          </div>
        </div>`;
      }).join("") + `<div style="margin-top:12px;padding-top:12px;border-top:2px solid #e5e7eb;font-size:18px;font-weight:900;text-align:right;">총 고정비 : ${money(totalFixed)}</div>`;
    }

    async function saveFixedItem() {
      const id = fixedItemId.value;
      const existingItem = fixedItems.find(item => item.id === id);
      const payload = {
        category: fixedItemCategory.value,
        amount: Number(fixedItemAmount.value),
        transfer_day: existingItem?.transfer_day || 1,
        memo: packMemo(fixedItemMemo.value, { accountId: fixedItemAccount.value }),
        last_completed_month: null
      };
      if (!payload.category || !fixedItemAccount.value || !payload.amount || payload.amount <= 0) {
        alert("카테고리, 출금 계좌, 금액을 정확히 입력하세요.");
        return;
      }

      if (cloudOnline && db) {
        try { let error; if (id) ({ error } = await db.from("moneybook_fixed_items").update(payload).eq("id", id)); else ({ error } = await db.from("moneybook_fixed_items").insert(payload)); if (error) throw error; closeModal("fixedItemModal"); await loadFixedItems(); renderFixedItemList(); return; }
        catch (error) { showOffline(error); }
      }
      if (id) { const i=fixedItems.findIndex(item=>String(item.id)===String(id)); if(i>=0) fixedItems[i]={...fixedItems[i],...payload}; }
      else fixedItems.push({...payload,id:uid()});
      cacheData({fixedItems});
      closeModal("fixedItemModal");
      renderFixedItemList();
    }

    async function deleteFixedItem() {
      const id = fixedItemId.value;
      if (!id) return;
      if (!confirm("이 고정비 항목을 삭제할까요? 기존 이체완료 내역은 삭제되지 않습니다.")) return;
      if (cloudOnline && db) {
        try { const { error } = await db.from("moneybook_fixed_items").delete().eq("id", id); if(error)throw error; closeModal("fixedItemModal"); await loadFixedItems(); renderFixedItemList(); return; }
        catch(error){ showOffline(error); }
      }
      fixedItems=fixedItems.filter(item=>String(item.id)!==String(id));cacheData({fixedItems});
      closeModal("fixedItemModal");
      renderFixedItemList();
    }

    async function completeFixedTransfer(item) {
      const currentMonth = `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,"0")}`;

      const alreadyCompleted = entries.some(e =>
        isFixedEntry(e) &&
        String(e.entry_date || "").startsWith(currentMonth) &&
        e.category === item.category &&
        Number(e.amount) === Number(item.amount)
      );
      if(alreadyCompleted){
        alert("이미 이번 달 이체완료 처리되었습니다.");
        return;
      }

      const dayInput = document.getElementById(`fixedDay_${item.id}`);
      const transferDay = Number(dayInput?.value || item.transfer_day || 1);

      if (!transferDay || transferDay < 1 || transferDay > 31) {
        alert("반영할 날짜를 1~31 사이로 입력하세요.");
        return;
      }

      const { y, m } = monthRange();
      const lastDay = new Date(y, m + 1, 0).getDate();
      const day = Math.min(transferDay, lastDay);
      const targetDate = `${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

      const duplicate = entries.find(e =>
        e.entry_date === targetDate &&
        e.category === item.category &&
        Number(e.amount) === Number(item.amount)
      );

      if (duplicate) {
        alert("이미 같은 내역이 있습니다.");
        return;
      }

      const payload = {
        entry_date: targetDate,
        type: "expense",
        category: item.category,
        amount: Number(item.amount),
        is_fixed: true,
        memo: packMemo(visibleMemo(item), { kind:"entry", accountId:entryMeta(item).accountId })
      };
      if (cloudOnline && db) {
        try { const { error } = await db.from("moneybook_entries").insert(payload); if(error)throw error; await db.from("moneybook_fixed_items").update({ last_completed_month: currentMonth, transfer_day: transferDay }).eq("id", item.id); }
        catch(error){ showOffline(error); allEntries.push({...payload,id:uid(),created_at:new Date().toISOString()}); cacheData({entries:allEntries}); }
      } else { allEntries.push({...payload,id:uid(),created_at:new Date().toISOString()}); cacheData({entries:allEntries}); }
      const localFixed=fixedItems.find(x=>String(x.id)===String(item.id));if(localFixed)localFixed.transfer_day=transferDay;cacheData({fixedItems});

      alert("이체완료. 내역에 반영되었습니다.");
      await loadFixedItems();
      await loadData();
      renderFixedItemList();
    }

    function openChartModal() { chartModal.classList.add("show"); renderChart(); }
    function renderChart() {
      const expenseEntries = entries.filter(e => e.type === "expense" && !isTransferEntry(e)); const grouped = {}; expenseEntries.forEach(e => grouped[e.category] = (grouped[e.category] || 0) + Number(e.amount));
      const labels = Object.keys(grouped), values = Object.values(grouped); chartEmpty.style.display = labels.length ? "none" : "block"; if (chartInstance) chartInstance.destroy(); if (!labels.length) return;
      chartInstance = new Chart(categoryChart, { type: "pie", data: { labels, datasets: [{ data: values }] }, options: { plugins: { tooltip: { callbacks: { label: ctx => { const total=values.reduce((a,b)=>a+b,0), value=ctx.raw, percent=total?Math.round(value/total*100):0; return `${ctx.label}: ${money(value)} (${percent}%)`; } } } } } });
    }

    function closeModal(id) { document.getElementById(id).classList.remove("show"); }
    function escapeHtml(value) { return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;"); }
    init();
  </script>
</body>
</html>
